name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check render sync
        run: node src/render.mjs && git diff --exit-code
      - name: Typecheck pi extension
        working-directory: packages/pi-tandem
        run: |
          npm ci
          npx tsc --noEmit
